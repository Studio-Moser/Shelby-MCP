[package]
name = "shelby-mcp"
description = "Knowledge-graph memory server for AI tools via MCP (stdio + streamable HTTP)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "shelby-mcp"
path = "src/main.rs"

[dependencies]
shelby-memory = { path = "../shelby-memory" }
axum = "0.8"
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-std"] }
